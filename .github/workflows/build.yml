name: Crear APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar web
        run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Permisos de archivos
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application android:requestLegacyExternalStorage="true"#' "$M"
          cat "$M"
          grep -q WRITE_EXTERNAL_STORAGE "$M"
      - run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Mostrar permisos de la APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: proyecto-gym-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
